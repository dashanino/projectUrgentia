<!-- TARJETA PRINCIPAL -->
<section class="card">
  <!-- TITULO -->
  <div class="card-header">
    <button type="button" class="back-button" (click)="goBack()">
      <mat-icon>chevron_left</mat-icon>
    </button>

    <h1>Síntomas</h1>
  </div>

  <!-- PROGRESO -->
  <div class="progress">
    <span class="circle completed">
      <mat-icon>check</mat-icon>
    </span>

    <span class="line completed-line"></span>

    <span class="circle completed">
      <mat-icon>check</mat-icon>
    </span>

    <span class="line completed-line"></span>

    <span class="circle active"></span>

    <span class="line"></span>

    <span class="circle">4</span>
  </div>

  <!-- BANDERAS -->
  <div class="symptom-content">
    <div class="symptom-grid">
      @for (sintoma of sintomas; track sintoma.id) {
        <button
          type="button"
          class="symptom-card"
          [class.selected]="sintomasSeleccionados.includes(sintoma.id)"
          (click)="seleccionarSintoma(sintoma.id)"
        >
          <p>{{ sintoma.nombre }}</p>
        </button>
      }
      <button
        type="button"
        class="symptom-card"
        [class.selected]="ningunoSeleccionado"
        (click)="seleccionarNinguno()"
      >
        <span>Otro</span>
      </button>
    </div>
  </div>

  <!-- CONTINUAR -->
  <div class="continue-container">
    <button
      type="button"
      class="continue-btn"
      [disabled]="sintomasSeleccionados.length === 0 && !ningunoSeleccionado"
      (click)="continuar()"
    >
      @if (cargando) {
        <span class="button-loading">
          <span class="spinner"></span>
          Guardando...
        </span>
      } @else {
        <span>Continuar</span>

        <mat-icon> arrow_forward </mat-icon>
      }
    </button>
  </div>
</section>
