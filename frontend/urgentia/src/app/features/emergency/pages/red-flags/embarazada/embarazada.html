
  

  <main class="main-layout">

    <!-- MENU IZQUIERDO -->
    <aside class="sidebar">

      <button class="emergency-btn">
        <img src="alerta.png" alt="Emergencia">
        Emergencia Inmediata
      </button>

      <div class="step completed-step">
        <span class="step-number">1</span>
        Antecedentes
      </div>

      <div class="step completed-step">
        <span class="step-number">2</span>
        Tipo de paciente
      </div>

      <div class="step active">
        <span class="step-number">3</span>
        Banderas Rojas
      </div>

      <div class="step">
        <span class="step-number">4</span>
        Resultado
      </div>

    </aside>


    <!-- TARJETA PRINCIPAL -->
    <section class="card">

      <!-- TITULO -->
      <div class="card-header">

          <button
          type="button"
          class="back-button"
          (click)="goBack()">
          <mat-icon>chevron_left</mat-icon>
        </button>

        <h1>Banderas Rojas</h1>

      </div>


      <!-- PROGRESO -->
      <div class="progress">

        <span class="circle completed">
          <mat-icon>check</mat-icon>
        </span>

        <span class="line completed-line"></span>

        <span class="circle completed">
          <mat-icon>check</mat-icon>
        </span>

        <span class="line completed-line"></span>

        <span class="circle active"></span>

        <span class="line"></span>

        <span class="circle">4</span>

      </div>


      <!-- BANDERAS -->
      <div class="symptom-grid">

        @for (sintoma of sintomas; track sintoma.id) {

          <button
            type="button"
            class="symptom-card"
            [class.selected]="sintomaSeleccionado === sintoma.id"
            (click)="seleccionarSintoma(sintoma.id)">

            <p>{{ sintoma.nombre }}</p>

          </button>

        }

      </div>

    </section>

  </main>
