<main class="main-layout">

  <!-- MENU IZQUIERDO -->
  <aside class="sidebar">

    <button class="emergency-btn">
      <img src="alerta.png" alt="Emergencia">
      Emergencia Inmediata
    </button>

    <div class="step completed-step">
      <span class="step-number">1</span>
      Antecedentes
    </div>

    <div class="step completed-step">
      <span class="step-number">2</span>
      Tipo de paciente
    </div>

    <div class="step active">
      <span class="step-number">3</span>
      Banderas Rojas
    </div>

    <div class="step">
      <span class="step-number">4</span>
      Resultado
    </div>

  </aside>


  <!-- TARJETA PRINCIPAL -->
  <section class="card">

    <!-- TITULO -->
    <div class="card-header">

      <button
        type="button"
        class="back-button"
        (click)="goBack()">
        <mat-icon>chevron_left</mat-icon>
      </button>

      <h1>Banderas Rojas</h1>

    </div>


    <!-- PROGRESO -->
    <div class="progress">

      <span class="circle completed">
        <mat-icon>check</mat-icon>
      </span>

      <span class="line completed-line"></span>

      <span class="circle completed">
        <mat-icon>check</mat-icon>
      </span>

      <span class="line completed-line"></span>

      <span class="circle active"></span>

      <span class="line"></span>

      <span class="circle">4</span>

    </div>


    <!-- BANDERAS -->
    <div class="flags-grid">

      <button
        type="button"
        class="flag-button"
        [class.selected]="estaSeleccionada(2)"
        (click)="seleccionarBandera(2)">
        Dolor de cabeza
      </button>

      <button
        type="button"
        class="flag-button"
        [class.selected]="estaSeleccionada(4)"
        (click)="seleccionarBandera(4)">
        Dolor en abdomen
      </button>

      <button
        type="button"
        class="flag-button"
        [class.selected]="estaSeleccionada(8)"
        (click)="seleccionarBandera(8)">
        Hemorragia vaginal
      </button>

      <button
        type="button"
        class="flag-button"
        [class.selected]="estaSeleccionada(9)"
        (click)="seleccionarBandera(9)">
        Tos con sangre
      </button>

      <button
        type="button"
        class="flag-button"
        [class.selected]="estaSeleccionada(10)"
        (click)="seleccionarBandera(10)">
        No siente al bebé
      </button>

      <button
        type="button"
        class="flag-button"
        [class.selected]="estaSeleccionada(11)"
        (click)="seleccionarBandera(11)">
        <span>Contracciones prematuras</span>
        <small>(Antes de la semana 37)</small>
      </button>

      <button
        type="button"
        class="flag-button"
        [class.selected]="estaSeleccionada(12)"
        (click)="seleccionarBandera(12)">
        Presión alta
      </button>

      <button
        type="button"
        class="flag-button"
        [class.selected]="estaSeleccionada(13)"
        (click)="seleccionarBandera(13)">
        Visión borrosa
      </button>

      <button
        type="button"
        class="flag-button"
        [class.selected]="estaSeleccionada(14)"
        (click)="seleccionarBandera(14)">
        Zumbidos o pitos en los oídos
      </button>

    </div>


    <!-- CONTINUAR -->
    <div class="continue-container">

      <button
        type="button"
        class="continue-btn"
        [disabled]="sintomasSeleccionados.length === 0"
        (click)="continuar()">

        Continuar
        <mat-icon>arrow_forward</mat-icon>

      </button>

    </div>

  </section>

</main>
