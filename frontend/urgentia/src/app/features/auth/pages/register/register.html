<div class="register-page">

    <!-- HEADER / LOGO -->
    <header class="register-header">
      <img
        src="logo.png"
        alt="Urgentia"
        class="logo"
      >
  
      <h1>Urgentia</h1>
  
      <div class="divider"></div>
  
      <p>
        Pre-triage inteligente <br>
        para urgencias
      </p>
    </header>
  
  
    <!-- TARJETA -->
    <section class="register-card">
  
        <div class="card-title">
            <button
            type="button"
            class="back-button"
            (click)="goBack()"
          >
            ‹
          </button>
  
        <h2>Nueva Cuenta</h2>
      </div>
  
  
      <form class="register-form">
  
        <!-- NOMBRES -->
        <div class="form-group">
          <label for="nombre">Nombres</label>
  
          <input
            id="nombre"
            type="text"
            placeholder="Maria José"
          >
        </div>
  
  
        <!-- APELLIDOS -->
        <div class="form-group">
          <label for="apellido">Apellidos</label>
  
          <input
            id="apellido"
            type="text"
            placeholder="Gómez Perez"
          >
        </div>
  
  
        <!-- CORREO -->
        <div class="form-group">
          <label for="correo">Correo electrónico</label>
  
          <input
            id="correo"
            type="email"
            placeholder="urgentina@mail.com"
          >
        </div>
  
  
        <!-- CELULAR -->
        <div class="form-group">
          <label for="celular">Número celular</label>
  
          <input
            id="celular"
            type="tel"
            placeholder="(123) 456-789"
          >
        </div>
  
  
        <!-- FECHA -->
        <div class="form-group">
          <label for="fecha">
            Fecha de nacimiento (DD/MM/YY)
          </label>
  
          <input
            id="fecha"
            type="date"
          >
        </div>
  
  
        <!-- EPS -->
        <div class="form-group">
          <label for="eps">EPS</label>
  
          <select id="eps">
            <option value="">Selecciona tu EPS</option>
            <option>Sura</option>
            <option>Sanitas</option>
            <option>Nueva EPS</option>
            <option>Salud Total</option>
          </select>
        </div>
  
  
        <!-- CONTRASEÑA -->
        <div class="form-group">
          <label for="password">Contraseña</label>
  
          <input
            id="password"
            type="password"
            placeholder="***************"
          >
        </div>
  
  
        <!-- REQUISITOS -->
        <div class="password-rules">
          <p>Mínimo 8 caracteres</p>
          <p>1 Mayúscula</p>
          <p>1 Número</p>
          <p>1 Carácter especial</p>
        </div>
  
  
        <!-- BOTÓN -->
        <div class="button-container">
            <button
              type="button"
              class="continue-button"
              (click)="continue()"
            >
              Continuar
            </button>
          </div>
  
      </form>
  
    </section>
  
  </div>
