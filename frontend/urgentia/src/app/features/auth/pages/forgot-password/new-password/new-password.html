<div class = ParentDiv>
    <section class="begin-visual">
        <img src="image 5.png" alt="Ilustración de urgencias" class="imagen-fondo" /> <!-- imágen de fondo-->
        <div class="nombre-visual">
        <img class="logo" src="logo.png" alt="Urgentia" />
        <h1>Urgentia</h1>
        <p>Sistema De Pre-Triage Para <br>Urgencias</p>
        </div>
    </section>
    

    <section class="info">
    <!-- info -->
        <div class="formulario">
        <h1>Nueva Contraseña</h1>
        <p>
            Ingrese su nueva contraseña
        </p>

        <form [formGroup]="form" (ngSubmit)="submit()" class="form">
            <h4>Nueva contraseña</h4>
            <label>
            <input type="password" formControlName="nueva_contraseña" placeholder="Ingrese una nueva contraseña" />
            </label>
            <h4>Confirmar nueva contraseña:</h4>
            <label>
            <input type="password" formControlName="confirmar_contraseña" placeholder="Ingrese nuevamente su contraseña" />
            </label>

            <div class="password-requirements">
            
            <ul class="password-requirements">
            <li>Mínimo 8 caracteres</li>
            <li>Al menos 1 mayúscula</li>
            <li>Al menos 1 número</li>
            <li>Al menos 1 carácter especial</li>
            </ul>
            </div>


            
            <button type="submit">Ingresar</button>
            
        </form>
        
        </div>
        
    </section>
</div>
