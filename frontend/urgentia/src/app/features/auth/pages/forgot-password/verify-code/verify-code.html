<div class = ParentDiv>
    <section class="begin-visual">
        <img src="image 5.png" alt="Ilustración de urgencias" class="imagen-fondo" /> <!-- imágen de fondo-->
        <div class="nombre-visual">
        <img class="logo" src="logo.png" alt="Urgentia" />
        <h1>Urgentia</h1>
        <p>Sistema De Pre-Triage Para <br>Urgencias</p>
        </div>
    </section>
    

    <section class="info">
    <!-- info -->
        <div class="formulario">
        <h1>Olvidé Mi Contraseña</h1>
        <img src="email.png" alt="Ilustración de correo"/>
        <p>
            Hemos enviado un código para reestablecer su contraseña a :
        </p>
        <span>urgentia@gmail.com</span>
        <p>
            El enlace expirará en 5 minutos.
        </p>

        <form [formGroup]="form" (ngSubmit)="submit()" class="form">
            <h4>Código</h4>
            <div class="code">
                <label>
                <input type="text" formControlName="codigo" placeholder="Ingrese el código" />
                </label>
                <button type="submit">Ingresar</button>
            </div>
        </form>
        <footer>
            <p>¿No recibiste el código?</p>
            <span>Reenviar código</span>
        </footer>
        </div>
        
    </section>
</div>
